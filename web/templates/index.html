<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSpy AI - Terminal Mode</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Leaflet for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        :root {
            --bg: #000000;
            --text-main: #0f0;
            --text-dim: #050;
            --accent: #f00;
            --border: #0f0;
            --surface: rgba(0, 20, 0, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg);
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            text-shadow: 0 0 5px var(--text-main);
        }

        /* Scanlines */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(
                to bottom,
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
        }

        /* Nav Header */
        header { 
            padding: 20px 40px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
        }
        
        h1 { 
            font-size: 2em; 
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .container { 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px;
            flex-grow: 1;
            width: 100%;
        }

        .panel { 
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px; 
            margin-bottom: 30px;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .upload-area { 
            border: 1px dashed var(--border); 
            padding: 40px 20px; 
            text-align: center; 
            cursor: pointer; 
            background: rgba(0,255,0,0.05);
            transition: all 0.3s ease; 
        }
        
        .upload-area:hover, .upload-area.dragover { 
            background: rgba(0,255,0,0.2); 
        }

        .upload-text {
            font-size: 1.2em;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group {
            margin-top: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: var(--accent);
        }

        textarea {
            width: 100%;
            height: 100px;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            padding: 10px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: 1px solid var(--accent);
        }

        .btn-run {
            background: var(--bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 30px;
            font-size: 1.2em;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 20px;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-run:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 15px var(--accent);
        }
        
        .btn-run:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Live Terminal */
        .terminal {
            background: #000;
            border: 1px solid var(--border);
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-top: 20px;
            display: none;
            font-size: 0.9em;
        }
        
        .terminal-line {
            margin-bottom: 4px;
        }

        /* Results Layout */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 20px;
            display: none;
        }

        .result-card {
            border: 1px solid var(--border);
            padding: 20px;
            background: rgba(0,20,0,0.5);
        }

        .result-card h3 {
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 5px;
        }

        .stat-group {
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2em;
            color: var(--text-main);
        }
        
        .stat-label {
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.8em;
        }

        #map {
            height: 300px;
            width: 100%;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        .file-list {
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-dim);
        }
        
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <header>
        <h1>SYS.GEOVISION // OP-MODE</h1>
        <div style="color: var(--accent);">[AUTHORIZED ACCESS ONLY]</div>
    </header>

    <div class="container">
        <div class="panel" id="mainPanel">
            <div class="upload-area" id="uploadArea">
                <div class="upload-text">> DRAG & DROP TARGET IMAGES</div>
                <div style="color: var(--text-dim);">[Accepts multiple files for VLM correlation]</div>
                <input type="file" id="imageInput" accept="image/*" multiple style="display: none;">
            </div>
            <div class="file-list" id="fileList"></div>

            <div class="form-group">
                <label>> TARGET CONTEXT & OSINT HINTS (OPTIONAL)</label>
                <textarea id="contextInput" placeholder="Enter known variables, region locks, or hints for the deep scan..."></textarea>
            </div>

            <button class="btn-run" id="analyzeBtn" onclick="analyzeImages()">
                > EXECUTE DEEP SCAN
            </button>
            
            <div class="terminal" id="terminal"></div>
        </div>

        <div class="results-grid" id="resultsGrid">
            <div class="result-card">
                <h3>> LOCATION_TRIANGULATED</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <div class="stat-group">
                            <div class="stat-label">LAT / LNG</div>
                            <div class="stat-value" id="resCoords">--</div>
                        </div>
                        <div class="stat-group">
                            <div class="stat-label">CONFIDENCE</div>
                            <div class="stat-value" id="resConfidence">--</div>
                        </div>
                        <a id="resMapsLink" href="#" target="_blank" style="color: var(--accent); text-transform: uppercase;">[ OPEN IN GOOGLE MAPS ]</a>
                    </div>
                    <div>
                        <div id="map"></div>
                    </div>
                </div>
            </div>

            <div class="result-card" id="rawOutputCard">
                <h3>> RAW_VLM_INTELLIGENCE</h3>
                <pre id="rawOutput" style="font-size: 0.8em; color: var(--text-dim);"></pre>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById("uploadArea");
        const imageInput = document.getElementById("imageInput");
        const fileList = document.getElementById("fileList");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const terminal = document.getElementById("terminal");
        const resultsGrid = document.getElementById("resultsGrid");
        const contextInput = document.getElementById("contextInput");
        
        let uploadedFiles = [];
        let map = null;
        let marker = null;
        
        function initMap() {
            if(!map) {
                map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap &copy; CARTO',
                    subdomains: 'abcd',
                    maxZoom: 20
                }).addTo(map);
            }
        }

        uploadArea.addEventListener("click", () => imageInput.click());
        uploadArea.addEventListener("dragover", (e) => { e.preventDefault(); uploadArea.classList.add("dragover"); });
        uploadArea.addEventListener("dragleave", () => { uploadArea.classList.remove("dragover"); });
        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            handleFiles(e.dataTransfer.files);
        });
        imageInput.addEventListener("change", (e) => handleFiles(e.target.files));
        
        function handleFiles(files) {
            if (files.length > 0) {
                uploadedFiles = Array.from(files);
                fileList.innerHTML = uploadedFiles.map(f => `[+] ${f.name}`).join('<br>');
            }
        }

        function appendLog(msg, color = 'var(--text-main)') {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.style.color = color;
            line.innerText = msg;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function analyzeImages() {
            if (uploadedFiles.length === 0) {
                alert("Upload at least one image.");
                return;
            }
            
            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "> INITIATING SCAN...";
            terminal.style.display = "block";
            terminal.innerHTML = "";
            resultsGrid.style.display = "none";
            
            appendLog("> ESTABLISHING CONNECTION TO GEOVISION CORE...");
            
            const formData = new FormData();
            uploadedFiles.forEach(f => formData.append("images", f));
            formData.append("context_text", contextInput.value);
            
            try {
                const response = await fetch("/api/analyze", {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                if (data.status === "started") {
                    connectStream(data.job_id);
                } else {
                    appendLog(`> ERROR: ${data.error}`, 'var(--accent)');
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerText = "> EXECUTE DEEP SCAN";
                }
            } catch (error) {
                appendLog(`> FATAL: ${error.message}`, 'var(--accent)');
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "> EXECUTE DEEP SCAN";
            }
        }
        
        function connectStream(jobId) {
            const evtSource = new EventSource(`/api/stream/${jobId}`);
            
            evtSource.onmessage = function(event) {
                if (event.data === ": keepalive") return;
                
                const msg = JSON.parse(event.data);
                
                if (msg.type === "log") {
                    appendLog(msg.data);
                } else if (msg.type === "error") {
                    appendLog(`> ERR: ${msg.data}`, 'var(--accent)');
                    evtSource.close();
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerText = "> EXECUTE DEEP SCAN";
                } else if (msg.type === "result") {
                    appendLog("> SCAN COMPLETE. PARSING DATA...", 'var(--accent)');
                    evtSource.close();
                    displayResults(msg.data);
                    analyzeBtn.disabled = false;
                    analyzeBtn.innerText = "> EXECUTE DEEP SCAN";
                }
            };
            
            evtSource.onerror = function() {
                appendLog("> CONNECTION LOST TO CORE.", 'var(--accent)');
                evtSource.close();
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "> EXECUTE DEEP SCAN";
            };
        }

        function displayResults(result) {
            resultsGrid.style.display = "grid";
            initMap();
            
            document.getElementById("rawOutput").innerText = JSON.stringify(result, null, 2);
            
            let best = null;
            if (result.best_estimate) {
                best = result.best_estimate;
            } else if (result.location_estimates && result.location_estimates.length > 0) {
                best = result.location_estimates[0];
            }
            
            if (best && best.latitude) {
                document.getElementById("resCoords").innerText = `${best.latitude.toFixed(6)}, ${best.longitude.toFixed(6)}`;
                document.getElementById("resConfidence").innerText = `${(best.confidence * 100).toFixed(1)}%`;
                document.getElementById("resMapsLink").href = `https://www.google.com/maps/search/?api=1&query=${best.latitude},${best.longitude}`;
                
                map.setView([best.latitude, best.longitude], 15);
                
                const pulseIcon = L.divIcon({
                    className: 'pulse-marker',
                    html: `<div style="width: 15px; height: 15px; background: #f00; border-radius: 50%; box-shadow: 0 0 15px #f00;"></div>`,
                    iconSize: [15, 15],
                    iconAnchor: [7.5, 7.5]
                });
                
                if(marker) map.removeLayer(marker);
                marker = L.marker([best.latitude, best.longitude], {icon: pulseIcon}).addTo(map);
                
                setTimeout(() => map.invalidateSize(), 100);
            }
        }
    </script>
</body>
</html>
